# path: .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Generate localizations
      run: flutter gen-l10n

    - name: Run build_runner
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Analyze code
      run: flutter analyze

    - name: Run tests
      run: flutter test --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false

    # Debug build only: validates that the app compiles for Android without
    # release signing secrets. Signed release builds (APK/AAB) are intentionally
    # not part of this workflow and must run in a separate trusted environment.
    # No artifact is uploaded because a debug APK is not a release artifact.
    - name: Build debug APK (compile gate)
      run: flutter build apk --debug

